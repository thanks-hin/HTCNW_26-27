<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine Template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
        }

        /* ---------- Top navbar ---------- */
        .top-navbar {
            background: #6e6e6e;
            padding: 14px 20px;
        }

        .top-navbar .navbar-brand {
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .top-navbar .nav-link {
            color: #eee !important;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .top-navbar .nav-link.disabled {
            color: #aaa !important;
        }

        .btn-download-now {
            background: #29b6d8;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            border: none;
            border-radius: 3px;
            padding: 10px 20px;
        }

        .btn-download-now:hover {
            background: #219ebb;
            color: #fff;
        }

        /* ---------- Hero section ---------- */
        .hero-section {
            background: linear-gradient(120deg, #f3c9e6 0%, #cfd0f2 50%, #b9d9f5 100%);
            padding: 50px 30px;
        }

        .hero-image img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .hero-text-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding-left: 30px;
        }

        .hero-heading {
            font-size: 56px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #222;
            margin-bottom: 24px;
        }

        .hero-subtext {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .btn-order-now {
            display: inline-block;
            border: 2px solid #222;
            color: #222;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 14px 34px;
            border-radius: 30px;
            background: transparent;
            width: fit-content;
        }

        .btn-order-now:hover {
            background: rgba(0,0,0,0.05);
            color: #222;
        }

        /* ---------- Highlights section ---------- */
        .highlights-section {
            position: relative;
            background-image: url('../img/road.jpg');
            background-size: cover;
            background-position: center;
            padding: 120px 30px 60px;
        }

        .highlights-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
        }

        .highlights-title {
            position: relative;
            color: #fff;
            text-align: center;
            font-weight: bold;
            font-size: 54px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @media (max-width: 767px) {
            .hero-text-col {
                padding-left: 0;
                margin-top: 30px;
                align-items: center;
                text-align: center;
            }
            .hero-heading {
                font-size: 36px;
            }
            .highlights-title {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>
    <!-- ================= TOP NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MAGAZINE TEMPLATE</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavContent" aria-controls="mainNavContent"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="mainNavContent">
                <ul class="navbar-nav align-items-lg-center me-3">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            BLOCK DEMOS 1
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Demo 1</a></li>
                            <li><a class="dropdown-item" href="#">Demo 2</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            BLOCK DEMOS 2
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Demo 1</a></li>
                            <li><a class="dropdown-item" href="#">Demo 2</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle disabled" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            SITE TEMPLATES 1
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            SITE TEMPLATES 2
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Template 1</a></li>
                            <li><a class="dropdown-item" href="#">Template 2</a></li>
                        </ul>
                    </li>
                </ul>
                <a class="btn btn-download-now" href="#">DOWNLOAD NOW!</a>
            </div>
        </div>
    </nav>

    <!-- ================= HERO SECTION ================= -->
    <section class="hero-section">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-6 hero-image">
                    <img src="../img/magazin.jpg" alt="Magazines">
                </div>
                <div class="col-md-6 hero-text-col">
                    <h1 class="hero-heading">AUTUMN SALE</h1>
                    <p class="hero-subtext">Purchase summer issues! 50% OFF</p>
                    <a href="#" class="btn-order-now">ORDER NOW</a>
                </div>
            </div>
        </div>
    </section>

    <!-- ================= HIGHLIGHTS SECTION ================= -->
    <section class="highlights-section">
        <h2 class="highlights-title">October Highlights</h2>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
