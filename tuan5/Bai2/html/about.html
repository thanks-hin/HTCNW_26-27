<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About - Feane</title>

<link relonts.googleapis.com
<link rel="preconnect" href<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600;700&displaye>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Open Sans',sans-serif;
    background:#222831;
}

/* NAVBAR */

.navbar{
    background:#111;
    padding:18px 80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    text-decoration:none;
    color:white;
    font-size:38px;
    font-family:'Dancing Script',cursive;
}

.nav-menu{
    list-style:none;
    display:flex;
    gap:35px;
}

.nav-menu a{
    text-decoration:none;
    color:white;
    text-transform:uppercase;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.nav-menu a:hover,
.nav-menu a.active{
    color:#ffbe33;
}

.order-btn{
    text-decoration:none;
    background:#ffbe33;
    color:#fff;
    padding:10px 28px;
    border-radius:30px;
    font-weight:600;
}

.order-btn:hover{
    background:#e6ac00;
}

/* ABOUT */

.about{
    min-height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:70px;
    padding:80px 10%;
}

.about-img{
    flex:1;
    text-align:center;
}

.about-img img{
    width:100%;
    max-width:450px;
}

.about-content{
    flex:1;
    color:white;
}

.about-content h2{
    font-family:'Dancing Script',cursive;
    font-size:54px;
    margin-bottom:20px;
}

.about-content p{
    line-height:1.8;
    margin-bottom:30px;
    font-size:16px;
}

.read-more{
    display:inline-block;
    text-decoration:none;
    background:#ffbe33;
    color:white;
    padding:12px 35px;
    border-radius:30px;
    font-weight:600;
}

.read-more:hover{
    background:#e6ac00;
}

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:15px;
        padding:20px;
    }

    .nav-menu{
        flex-wrap:wrap;
        justify-content:center;
    }

    .about{
        flex-direction:column;
        text-align:center;
    }

    .about-content h2{
        font-size:42px;
    }
}

</style>
</head>

<body>

<nav class="navbar">

    <a href="home.html" class="logo">Feane</a>

    <ul class="nav-menu">
        <li><a href="home.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html" class="active">About</a></li>
        <li><a href="book.html">Book Table</a></li>
    </ul>

    <a href="order.html" class="order-btn">Order Online</a>

</nav>

<section class="about">

    <div class="about-img">
        <img src="about-img.png" alt="About Feane">
    </div>

    <div class="about-content">
        <h2>We Are Feane</h2>

        <p>
            There are many variations of passages of Lorem Ipsum available,
            but the majority have suffered alteration in some form, by
            injected humour, or randomised words which don't look even
            slightly believable.
        </p>

        #Read More</a>
    </div>

</section>

</body>
</html>
