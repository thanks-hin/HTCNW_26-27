<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feane - Fast Food Restaurant</title>

    <!-- Bootstrap có sẵn trong project -->
    <link rel="stylesheet" href="../css/bootstrap.css">

    <!-- Font Awesome có sẵn trong project -->
    <style>
        @font-face {
            font-family: "FontAwesome";
            src: url("../fonts/fontawesome-webfont.woff2") format("woff2"), url("../fonts/fontawesome-webfont.woff") format("woff");
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        a {
            text-decoration: none;
        }
        
        .navbar-custom {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            z-index: 10;
        }
        
        .navbar-container {
            width: 1140px;
            max-width: calc(100% - 40px);
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        /* Logo */
        
        .logo {
            color: white;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
        }
        
        .logo:hover {
            color: white;
        }
        /* Menu */
        
        .nav-menu {
            display: flex;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
            margin-left: auto;
        }
        
        .nav-menu li {
            margin-left: 35px;
        }
        
        .nav-menu a {
            color: white;
            font-size: 14px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffbe33;
        }
        /* =========================
           ICONS
        ========================= */
        
        .nav-icons {
            display: flex;
            align-items: center;
            margin-left: 35px;
        }
        
        .nav-icons a {
            color: white;
            margin-left: 18px;
            font-family: "FontAwesome";
            font-size: 16px;
            transition: 0.3s;
        }
        
        .nav-icons a:hover {
            color: #ffbe33;
        }
        /*
            Font Awesome:
            \f007 = user
            \f07a = shopping cart
            \f002 = search
        */
        
        .icon-user::before {
            content: "\f007";
        }
        
        .icon-cart::before {
            content: "\f07a";
        }
        
        .icon-search::before {
            content: "\f002";
        }
        /* =========================
           ORDER ONLINE BUTTON
        ========================= */
        
        .order-online {
            display: inline-block;
            margin-left: 25px;
            padding: 10px 25px;
            color: white;
            background: #ffbe33;
            border-radius: 25px;
            font-size: 14px;
            transition: 0.3s;
        }
        
        .order-online:hover {
            color: white;
            background: #e8a91d;
        }
    </style>
</head>
