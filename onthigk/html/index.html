<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập GK</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        
        .layout {
            height: 700px;
            width: 100%;
            background-color: cadetblue;
        }
        
        .header {
            height: 150px;
            width: 100%;
            display: flex;
            background-color: azure;
            align-items: center;
        }
        
        .logo {
            margin-left: 20px;
            display: flex;
            height: 80%;
            align-items: center;
            gap: 10px;
        }
        
        .logo img {
            height: auto;
            width: auto;
        }
        
        .logo h1 {
            font-family: monospace;
            font-size: large;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box input {}
        
        .footer {
            height: 150px;
            width: 100%;
            background-color: rgb(120, 230, 230);
        }
        
        .nav {
            height: 50px;
            width: 100%;
            background-color: rgb(229, 185, 170);
        }
        
        .content {
            height: 100%;
            /* width: 100%; */
            background-color: coral;
        }
        
        .aside1 {
            height: 100%;
            width: 20%;
            background-color: bisque;
            float: left;
        }
        
        .aside2 {
            height: 100%;
            width: 20%;
            background-color: beige;
            float: right;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="header">
            <div class="logo">
                <img src="../img/logo.png" alt="">
                <h1>Tôi yêu trường tôi</h1>
            </div>
            <div class="search-box">
                <input type="search" name="search" id="search-box" placeholder="tìm cái gì đó">
            </div>
        </div>
        <div class="nav"></div>
        <div class="content">
            <div class="aside1"></div>
            <div class="section1"></div>
            <div class="aside2"></div>
        </div>
        <div class="footer"></div>
    </div>
</body>

</html>
