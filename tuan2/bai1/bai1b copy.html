<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Cafe Menu</title>
</head>
<style>
    *{
        box-sizing: border-box;
        margin: auto;
    }
    #container{
        width: 900px;
        height: 800px;
        border: 1px solid red;
        align-items: center;
    }
    #header1{
        width: 100%;
        height: 150px;
        background-color: palevioletred;
    }
    #menungang{
        width: 100%;
        height: 50px;
        background-color: rgb(81, 205, 212);
    }
    #menudoc{
        width: 20%;
        height: 500px;
        background-color: aliceblue;
        float: left;
    }
    #content1{
        width: 50%;
        height: 500px;
        background-color: rgb(160, 83, 111);
        float: left;
    }
    #content2{
        width: 30%;
        height: 500px;
        background-color: rgb(206, 97, 149);
        float: left;
    }
    #footer{
        width: 100%;
        height: 100px;
        background-color: green;
        clear: both;
    }
    #menudoc ul{
        margin-left: -50px;
    }
    #menudoc ul li{
        list-style-type: none;
        background-color: antiquewhite;
        margin-top: 5px;
        width: 150px;
        padding: 5px;
        border-radius: 10px;
    }
    #menudoc ul li a{
        text-decoration: none;
        color: aliceblue;
    }
    #menudoc img{
        border-radius: 50%;
        border: 1px solid salmon;
        margin-top: 20px;
        margin-left: 10px;
        box-shadow: 5px 5px 5px;
    }
    #content2 #den{
        width: 95%;
        height: 90%;
        background-color: black;
        margin-top: 5px;
        text-decoration-color: aliceblue;
    }
</style>
<body>
    <div id="container">
        <div id="header1">
            <h1>Example Cafe Menu</h1>
        </div>
        <div id="menungang"></div>
        <div id="menudoc">
            <ul>   <!--unordered list-->
            <li>Chestnut and Mushroom Goujons (v)</li>
            <li>Goat Cheese Salad (v)</li>
            <li>Honey Soy Chicken Kebabs</li>
            <li>Seafood Salad</li>
            </ul>
            <img src="diamond.jpg" width="100%" height="50%">
        </div>
        <div id="content1"></div>
        <div id="content2"></div>
        <div id="footer"></div>
    </div>
    <div id="container"><h1></h1></div>
</body>
</html>
