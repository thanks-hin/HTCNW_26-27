<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body style="background-color: #99CDFD;">
    <div Align="center"><img src="logo.png" Align="middle"></div>

    <div Align="center">
        <h1>Registration Form</h1>
    </div>

    <div Align="center" style="margin-bottom: 16px;">Register your Jackson Electronics product here</div>

    <form style="width: 80%; margin: auto">

        <label for="firstname">First Name:</label>
        <input type="text" name="firstname">
        <label for="lastname">Last Name:</label>
        <input type="text" name="lastname">
        <br> <label for="addno1">Address #1:</label>
        <input type="text" name="addno1">
        <br><label for="addno2">Address #2:</label>
        <input type="text" name="addno2">
        <br><label for="city">City:</label>
        <input type="text" name="city">
        <label for="zip">Zip:</label>
        <input type="text" name="zip">
        <label for="state">State:</label>
        <input type="text" name="state">
        <br><label for="country">Country:</label>
        <input type="text" name="country"> <br>

        <hr />
        <label for="product">Product:</label>
        <select name="product_option" size="1">
            <option value="scanmaster" selected>Scan Master</option>
            <option value="sth_else">something else</option>
        </select>
        <br>
        <label for="date_purchase">Date Purchased:</label>
        <input type="date" name="date_purchase">
        <br>
        <label for="serial">Serial #:</label>
        <input type="text" name="serial">
        <br>
        <label for="use">Used for:</label>
        <input type="radio" name="use" value="home">Home
        <input type="radio" name="use" value="edu">Educational Institution<br>
        <input type="radio" name="use" value="bus">Bussiness
        <input type="radio" name="use" value="other">Other<br>
        <input type="radio" name="use" value="gov">Government<br>

        <label for="system">System(check all that apply):</label>
        <input type="checkbox" name="system" value="win">Windows
        <input type="checkbox" name="system" value="unix">UNIX<br>
        <input type="checkbox" name="system" value="mac">Macintosh
        <input type="checkbox" name="system" value="other">Other<br>

        <hr />
        <label for="comt">Comments?:</label>
        <textarea name="comt"></textarea>
        <br>

        <div style="margin: auto;">
        <input type="submit" value="Click to register">
        <input type="reset" value="Click to cancel">
        </div>
    </form>
</body>

</html>
