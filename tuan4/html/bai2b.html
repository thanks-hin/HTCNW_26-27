<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap Collapsible Navbar</title>
<link rel="stylesheet" href="../css/bootstrap.min.css">
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
  }
  .hero-img {
    width: 100%;
    max-height: 380px;
    object-fit: cover;
  }
  .gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    margin-bottom: 20px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- Search form -->
    <form class="d-flex me-auto" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
      <button class="btn btn-outline-light" type="submit">Search</button>
    </form>

    <!-- Toggler button -->
    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible links -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            Products
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Engineering</a></li>
            <li><a class="dropdown-item" href="#">Telecom</a></li>
            <li><a class="dropdown-item" href="#">Energy</a></li>
            <li><a class="dropdown-item" href="#">Finace</a></li>
            <li><a class="dropdown-item" href="#">Consultancy</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>
      </ul>
    </div>

  </div>
</nav>

<!-- ================= CONTENT DEMO ================= -->
<img src="../img/anh1.jpg" class="hero-img" alt="Banner">

<div class="container my-5">
  <h2 class="mb-4 text-center">Our Gallery</h2>
  <div class="row gallery">
    <div class="col-md-4">
      <img src="../img/anh2.jpg" alt="Image 2">
    </div>
    <div class="col-md-4">
      <img src="../img/anh3.jpg" alt="Image 3">
    </div>
    <div class="col-md-4">
      <img src="../img/anh4.jpg" alt="Image 4">
    </div>
  </div>
</div>

<!-- Bootstrap Bundle JS (bao gồm Popper) -->
<script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
