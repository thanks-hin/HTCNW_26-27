<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký tài khoản - Validation</title>
<link rel="stylesheet" href="../css/bootstrap.min.css">
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6fa;
  }
  .form-wrapper {
    max-width: 700px;
    margin: 40px auto;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 30px 35px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="form-wrapper">
    <form class="row g-3 needs-validation" novalidate>

      <!-- First name -->
      <div class="col-md-4">
        <label for="firstName" class="form-label">First name</label>
        <input type="text" class="form-control" id="firstName" value="Mark" required>
        <div class="valid-feedback">Looks good!</div>
      </div>

      <!-- Last name -->
      <div class="col-md-4">
        <label for="lastName" class="form-label">Last name</label>
        <input type="text" class="form-control" id="lastName" value="Otto" required>
        <div class="valid-feedback">Looks good!</div>
      </div>

      <!-- Username -->
      <div class="col-md-4">
        <label for="username" class="form-label">Username</label>
        <div class="input-group has-validation">
          <span class="input-group-text" id="inputGroupPrepend">@</span>
          <input type="text" class="form-control" id="username"
                 aria-describedby="inputGroupPrepend" required>
          <div class="invalid-feedback">Please choose a username.</div>
        </div>
      </div>

      <!-- City -->
      <div class="col-md-6">
        <label for="city" class="form-label">City</label>
        <input type="text" class="form-control" id="city" required>
        <div class="invalid-feedback">Please provide a valid city.</div>
      </div>

      <!-- State -->
      <div class="col-md-3">
        <label for="state" class="form-label">State</label>
        <input type="text" class="form-control" id="state" required>
        <div class="invalid-feedback">Please provide a valid state.</div>
      </div>

      <!-- Zip -->
      <div class="col-md-3">
        <label for="zip" class="form-label">Zip</label>
        <input type="text" class="form-control" id="zip" required>
        <div class="invalid-feedback">Please provide a valid zip.</div>
      </div>

      <!-- Agree checkbox -->
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="agreeTerms" required>
          <label class="form-check-label" for="agreeTerms">
            Agree to terms and conditions
          </label>
          <div class="invalid-feedback">You must agree before submitting.</div>
        </div>
      </div>

      <!-- Submit -->
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Submit form</button>
      </div>

    </form>
  </div>
</div>

<script src="../js/bootstrap.bundle.min.js"></script>
<script>
  // Bootstrap 5 custom form validation
  (function () {
    'use strict';

    const forms = document.querySelectorAll('.needs-validation');

    Array.from(forms).forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>
</body>
</html>
