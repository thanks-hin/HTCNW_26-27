<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Form</title>

    <!-- Bootstrap 5 local -->
    <link rel="stylesheet" href="../css/bootstrap.min.css">

    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Khung chính */
        .payment-container {
            width: 82%;
            max-width: 905px;
            margin: 20px auto;
            border: 2px solid #5ba4e5;
            background-color: #fff;
        }

        /* =========================
           CHECKOUT
        ========================= */

        .checkout-section {
            background-color: #f7faff;
            padding: 55px 60px 45px;
        }

        .section-title {
            font-size: 30px;
            font-weight: 400;
            color: #111;
            padding-bottom: 14px;
            margin-bottom: 0;
            border-bottom: 1px solid #ddd;
        }

        /* Bảng sản phẩm */
        .checkout-table {
            width: 100%;
            margin: 0;
        }

        .checkout-table td {
            padding: 22px 0;
            border: none;
            vertical-align: top;
        }

        .checkout-table tr.total-row td {
            border-top: 1px solid #ddd;
            padding-top: 25px;
            padding-bottom: 10px;
        }

        .product-name {
            display: block;
            font-size: 24px;
            color: #111;
            margin-bottom: 7px;
        }

        .product-description {
            display: block;
            font-size: 19px;
            color: #9a9a9a;
        }

        .product-price {
            text-align: right;
            font-size: 23px;
            color: #111;
            white-space: nowrap;
        }

        .total-text {
            font-size: 24px;
            font-weight: 500;
        }

        .total-price {
            font-size: 24px;
            font-weight: 500;
            text-align: right;
        }


        /* =========================
           CREDIT CARD
        ========================= */

        .card-section {
            padding: 60px;
            background-color: #fff;
        }

        .card-section .section-title {
            margin-bottom: 30px;
        }

        .form-label {
            display: block;
            font-size: 16px;
            color: #777;
            margin-bottom: 12px;
        }

        .form-control {
            height: 56px;
            border: 1px solid #d5d5d5;
            border-radius: 4px;
            font-size: 21px;
            padding: 10px 18px;
            color: #555;
        }

        .form-control::placeholder {
            color: #999;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        /* Ô MM / YY */
        .expiration-input {
            width: 130px;
        }

        .slash {
            font-size: 25px;
            color: #777;
            margin: 0 10px;
            line-height: 56px;
        }

        .cvc-input {
            width: 100%;
        }

        /* Nút Proceed */
        .proceed-btn {
            width: 100%;
            height: 70px;
            margin-top: 45px;
            border: none;
            border-radius: 4px;
            background-color: #087df5;
            color: white;
            font-size: 24px;
            font-weight: 500;
            transition: 0.2s;
        }

        .proceed-btn:hover {
            background-color: #006fe6;
        }

        .proceed-btn:active {
            transform: translateY(1px);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .payment-container {
                width: 95%;
                margin: 15px auto;
            }

            .checkout-section,
            .card-section {
                padding: 30px 25px;
            }

            .section-title {
                font-size: 25px;
            }

            .product-name {
                font-size: 20px;
            }

            .product-description {
                font-size: 16px;
            }

            .product-price {
                font-size: 19px;
            }

            .total-text,
            .total-price {
                font-size: 21px;
            }

            .expiration-input {
                width: 90px;
            }

            .slash {
                margin: 0 5px;
            }
        }

        @media (max-width: 576px) {

            .checkout-table td {
                padding: 16px 0;
            }

            .card-section .row {
                row-gap: 20px;
            }

            .expiration-input {
                width: 85px;
            }

            .proceed-btn {
                height: 60px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="payment-container">

        <!-- =========================
             CHECKOUT
        ========================== -->

        <div class="checkout-section">

            <h1 class="section-title">
                Checkout
            </h1>

            <table class="table checkout-table">

                <tbody>

                    <!-- Product 1 -->
                    <tr>
                        <td>
                            <span class="product-name">
                                Product 1
                            </span>

                            <span class="product-description">
                                Lorem ipsum dolor sit amet
                            </span>
                        </td>

                        <td class="product-price">
                            $200
                        </td>
                    </tr>

                    <!-- Product 2 -->
                    <tr>
                        <td>
                            <span class="product-name">
                                Product 2
                            </span>

                            <span class="product-description">
                                Lorem ipsum dolor sit amet
                            </span>
                        </td>

                        <td class="product-price">
                            $120
                        </td>
                    </tr>

                    <!-- Total -->
                    <tr class="total-row">
                        <td>
                            <span class="total-text">
                                Total
                            </span>
                        </td>

                        <td class="total-price">
                            $320
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>


        <!-- =========================
             CREDIT CARD DETAILS
        ========================== -->

        <div class="card-section">

            <h2 class="section-title">
                Credit Card Details
            </h2>

            <form>

                <div class="row">

                    <!-- Card Holder -->
                    <div class="col-md-7">

                        <label for="cardHolder" class="form-label">
                            CARD HOLDER
                        </label>

                        <input
                            type="text"
                            id="cardHolder"
                            class="form-control"
                            placeholder="Card Holder"
                        >

                    </div>


                    <!-- Expiration -->
                    <div class="col-md-5">

                        <label class="form-label">
                            EXPIRATION DATE
                        </label>

                        <div class="d-flex align-items-center">

                            <input
                                type="text"
                                class="form-control expiration-input"
                                placeholder="MM"
                                maxlength="2"
                            >

                            <span class="slash">
                                /
                            </span>

                            <input
                                type="text"
                                class="form-control expiration-input"
                                placeholder="YY"
                                maxlength="2"
                            >

                        </div>

                    </div>

                </div>


                <div class="row mt-4">

                    <!-- Card Number -->
                    <div class="col-md-8">

                        <label for="cardNumber" class="form-label">
                            CARD NUMBER
                        </label>

                        <input
                            type="text"
                            id="cardNumber"
                            class="form-control"
                            placeholder="Card Number"
                        >

                    </div>


                    <!-- CVC -->
                    <div class="col-md-4">

                        <label for="cvc" class="form-label">
                            CVC
                        </label>

                        <input
                            type="text"
                            id="cvc"
                            class="form-control"
                            placeholder="CVC"
                            maxlength="3"
                        >

                    </div>

                </div>


                <!-- Proceed -->
                <button
                    type="submit"
                    class="btn proceed-btn">
                    Proceed
                </button>

            </form>

        </div>

    </div>

    <script src="../css/bootstrap.bundle.min.js"></script>
</body>

</html>
